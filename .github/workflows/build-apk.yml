
name: Build DRAK APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: |
          set -eux
          unzip -q DRAK_Android_projekt_s_cloud_buildom.zip -d /tmp/drak
          SRC="/tmp/drak/DRAK_Android_Projekt"
          test -f "$SRC/settings.gradle"
          test -d "$SRC/app"
          cp -a "$SRC/app" .
          cp "$SRC/build.gradle" .
          cp "$SRC/settings.gradle" .
          cp "$SRC/gradle.properties" .

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DRAK-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
